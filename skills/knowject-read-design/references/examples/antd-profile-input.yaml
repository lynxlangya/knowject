knowject_version: "0.1"
project:
  name: Knowject
  description: 让项目知识为团队所用
  type: monorepo
  locale: zh
stack:
  package_manager: pnpm@10
  frontend:
    framework: react@19
    bundler: vite@7
    ui: antd@6
    styling: tailwind@4
    language: typescript@5.9
  backend:
    framework: express@4
    language: typescript@5.9
    database: mongodb@7
design:
  sources:
    - path: files/designs/
      format: png
  output:
    components_dir: apps/platform/src/components
    pages_dir: apps/platform/src/pages
