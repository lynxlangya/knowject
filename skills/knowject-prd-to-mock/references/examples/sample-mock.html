<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowject · 项目知识中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #1677ff;
      --brand-50: #e6f0ff;
      --brand-font: 'Inter', system-ui, sans-serif;
    }
    body { font-family: var(--brand-font); }
    .text-brand    { color: var(--brand); }
    .bg-brand      { background-color: var(--brand); }
    .bg-brand-50   { background-color: var(--brand-50); }
    .border-brand  { border-color: var(--brand); }
    .ring-brand    { --tw-ring-color: var(--brand); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <!-- Generated by knowject-prd-to-mock. Brand: #1677ff + Inter, system-ui. Voice: professional, concise. -->

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-7xl px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 rounded bg-brand"></div>
        <span class="font-semibold text-lg">Knowject</span>
      </div>
      <div class="h-9 w-9 rounded-full bg-slate-200"></div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-8 grid grid-cols-12 gap-8">

    <section class="col-span-9 space-y-8">

      <div class="rounded-xl bg-white border border-slate-200 p-6">
        <h1 class="text-2xl font-semibold">下午好</h1>
        <p class="text-slate-600 mt-1">今天 <span class="text-brand font-medium">4 条待办</span>，本周新增 <span class="text-brand font-medium">17 条知识</span>。</p>
      </div>

      <div>
        <h2 class="text-sm font-semibold tracking-wide text-slate-500 uppercase mb-3">我的项目</h2>
        <div class="grid grid-cols-2 gap-4">
          <article class="rounded-xl bg-white border border-slate-200 p-5">
            <div class="flex items-start justify-between">
              <div>
                <h3 class="font-semibold text-lg">项目 A</h3>
                <p class="text-xs text-slate-500 mt-1">最近活跃 12 分钟前</p>
              </div>
              <span class="text-xs px-2 py-0.5 rounded bg-brand-50 text-brand">128 条</span>
            </div>
            <ul class="mt-4 space-y-2 text-sm text-slate-600">
              <li>· 最新问答 1</li>
              <li>· 最新问答 2</li>
              <li>· 最新问答 3</li>
            </ul>
          </article>

          <article class="rounded-xl bg-white border border-slate-200 p-5">
            <div class="flex items-start justify-between">
              <div>
                <h3 class="font-semibold text-lg">项目 B</h3>
                <p class="text-xs text-slate-500 mt-1">最近活跃 2 小时前</p>
              </div>
              <span class="text-xs px-2 py-0.5 rounded bg-brand-50 text-brand">47 条</span>
            </div>
            <ul class="mt-4 space-y-2 text-sm text-slate-600">
              <li>· 最新问答 1</li>
              <li>· 最新问答 2</li>
              <li>· 最新问答 3</li>
            </ul>
          </article>
        </div>
      </div>

      <div class="flex gap-3">
        <button class="bg-brand text-white px-5 py-2.5 rounded-lg font-medium">邀请同事</button>
        <button class="bg-white border border-slate-300 px-5 py-2.5 rounded-lg font-medium">新建项目</button>
      </div>

    </section>

    <aside class="col-span-3 space-y-4">
      <h2 class="text-sm font-semibold tracking-wide text-slate-500 uppercase">动态</h2>
      <ol class="space-y-3 text-sm">
        <li class="rounded-lg bg-white border border-slate-200 p-3">
          <span class="text-brand font-medium">成员 A</span> 在项目 A 提问。
          <p class="text-xs text-slate-400 mt-1">15 分钟前</p>
        </li>
        <li class="rounded-lg bg-white border border-slate-200 p-3">
          <span class="text-brand font-medium">成员 B</span> 总结：本周工作记录。
          <p class="text-xs text-slate-400 mt-1">1 小时前</p>
        </li>
        <li class="rounded-lg bg-white border border-slate-200 p-3">
          <span class="text-brand font-medium">成员 C</span> 提交：新文档。
          <p class="text-xs text-slate-400 mt-1">3 小时前</p>
        </li>
      </ol>
    </aside>

  </main>

</body>
</html>
