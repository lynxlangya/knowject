name: Skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pyyaml

      - run: bash skills/scripts/verify.sh

      - run: bash skills/scripts/test-install.sh

      - run: git diff --check
